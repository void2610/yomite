name = "yomite"
main = "src/worker.js"
compatibility_date = "2024-11-01"

# D1 / R2 は名前だけを指定する。GitHub 連携（Workers Builds）でデプロイすると
# 現在の wrangler が初回デプロイ時に同名の D1 と R2 を自動で用意する想定。
# 自動で用意されなかった場合はダッシュボードで同名のものを作ってから再デプロイする。
[[d1_databases]]
binding = "DB"
database_name = "yomite"
migrations_dir = "migrations"
[[r2_buckets]]
binding = "PAGES_BUCKET"
bucket_name = "yomite-pages"

# PUBLISH_TOKEN はファイルに書かず secret で設定すること:
#   npx wrangler secret put PUBLISH_TOKEN
# ローカル開発では .dev.vars に PUBLISH_TOKEN=dev-token と書く (gitignore 済み)。
# .dev.vars が無く PUBLISH_TOKEN 未設定の場合、Worker は開発用に認証を素通しする。
